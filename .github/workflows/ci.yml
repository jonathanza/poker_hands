name: CI

on:
  push:
    branches: [ main, claude/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install ruff

    - name: Check code formatting with Ruff
      run: ruff format --check *.py

    - name: Lint with Ruff
      run: ruff check *.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.local/share/virtualenvs
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pipenv-

    - name: Install pipenv
      run: pip install pipenv

    - name: Install dependencies
      run: pipenv install --python $(which python) --dev --skip-lock --pre

    - name: Run unit tests
      run: pipenv run python -m unittest unit_tests.py

    - name: Run tests with coverage (Python 3.11 only)
      if: matrix.python-version == '3.11'
      run: pipenv run coverage run -m unittest unit_tests.py

    - name: Generate coverage report
      if: matrix.python-version == '3.11'
      run: |
        pipenv run coverage report
        pipenv run coverage xml -o coverage.xml

    - name: Check coverage thresholds
      if: matrix.python-version == '3.11'
      run: |
        pipenv run coverage report --fail-under=90

    - name: Upload coverage to Codacy
      if: matrix.python-version == '3.11' && github.event_name == 'push'
      uses: codacy/codacy-coverage-reporter-action@v1
      continue-on-error: true
      with:
        project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
        coverage-reports: coverage.xml

    - name: Upload coverage artifact
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.xml
          .coverage
        retention-days: 30

  cli-test:
    name: CLI Smoke Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install pipenv
      run: pip install pipenv

    - name: Install dependencies
      run: pipenv install --python $(which python) --skip-lock --pre

    - name: Test CLI imports and basic functionality
      run: |
        # Test that the CLI can be imported and shows help
        pipenv run python -c "import poker_hand_cli; print('CLI module imports successfully')"

        # Test that poker_hand module works
        pipenv run python -c "from poker_hand import PokerHand, Rank; hand = PokerHand([('A', 'H'), ('K', 'H'), ('Q', 'H'), ('J', 'H'), ('T', 'H')]); print(f'Test hand: {hand.classify()}')"
