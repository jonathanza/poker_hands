name: Auto-format & Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  autoformat:
    name: Auto-format code
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push commits to the PR branch
      pull-requests: write  # Optional, allows annotations
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Install pre-commit hooks
        run: pre-commit install --install-hooks

      - name: Run formatters (allow changes)
        run: pre-commit run --all-files || true

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format code via pre-commit"
          commit_user_name: "formatter-bot"
          commit_user_email: "formatter-bot@users.noreply.github.com"
          commit_options: '--no-verify'

  verify:
    name: Verify formatting
    needs: autoformat
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Install pre-commit hooks
        run: pre-commit install --install-hooks

      - name: Verify formatting is clean
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check for formatting issues
        if: failure()
        run: |
          echo "❌ Formatting verification failed!"
          echo "The autoformat job should have fixed all issues, but some remain."
          echo "This might indicate:"
          echo "  - A tool failed to run in the autoformat job"
          echo "  - A formatting conflict between tools"
          echo "  - A file that cannot be auto-formatted"
          echo ""
          echo "Please check the logs above for details."
          exit 1
