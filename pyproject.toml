[tool.ruff]
# Same line length as black default
line-length = 88
target-version = "py38"

[tool.ruff.lint]
# Start with a conservative set of rules
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
]

# isort-compatible settings
isort.known-first-party = ["poker_hand", "poker_hand_cli"]

[tool.ruff.format]
# Format settings compatible with black
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
include = ["poker_*.py"]
omit = ["*/__init__.py", "*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "return NotImplemented",
    "return None",
    "pass",
]
